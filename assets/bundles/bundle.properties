# Mod
onetry.title = OneTry

# Intro
onetry.intro.tagline = One life. One try. No respawn.
onetry.intro.text = This mod makes the campaign a lot harder. You pick how much with two settings.
onetry.intro.stake = What dying costs you. Anything above Safe also makes ore run out.
onetry.intro.industry = How fast your factories run.
onetry.intro.later = Later
onetry.intro.open = Open Settings

# Stakes
onetry.stake.title = Stakes
onetry.stake.locked = Locked till you finish the campaign. You can only change it after a loss.

onetry.stake.safe = Safe
onetry.stake.safe.tip = No risk, same as vanilla.
onetry.stake.mortal = Mortal
onetry.stake.mortal.tip = You die once and the run is over.
onetry.stake.brittle = Brittle
onetry.stake.brittle.tip = Pretty much any hit will kill you.
onetry.stake.terminal = Fatal
onetry.stake.terminal.tip = Any hit on you or a core ends the run.\nCareful, you can't change this once the campaign starts.

onetry.wipe = Wipe progress on death

